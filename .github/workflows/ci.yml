name: Three-tier-task_board

on: 
  pull_request: 
    branches: [Main, Testing]
  push:
    branches: [Main, Testing]

  workflow_dispatch:

permissions: 
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  checkout-and-validate:
    name: "01. Checkout and repository validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          echo "Repository structure check passes"

  workflow-security-audit:
    name: "02. Github Actions security audit"
    needs: checkout-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
          annotations: true
          persona: 'pedantic'


  workflow-lint:
    name: "03. Workflow YAML Lint"
    needs: checkout-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        id: install-actionlint
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/download-actionlint.bash"
          curl --fail --silent --show-error --location \
          https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
          --output "$installer"
          bash "$installer" 1.7.12 "$RUNNER_TEMP"

      - name: Lint workflows
        shell: bash
        env:
          ACTIONLINT: ${{ steps.install-actionlint.outputs.executable }}
        run: |
          set -euo pipefail
          "$ACTIONLINT" -color


  code-quality:
    name: "04. Code quality (${{ matrix.component }})"
    needs: checkout-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.component }}
    
    env:
      CI: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Show runtime versions
        run: |
          set -euo pipefail
          node --version
          npm --version
      
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund

      - name: Run ESLint
        run: |
          set -euo pipefail
          npm run lint -- --max-warnings=0

      - name: Check Prettier formatting
        run: |
          set -euo pipefail
          npm run format:check

     



    
