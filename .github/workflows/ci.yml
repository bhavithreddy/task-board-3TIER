name: Three-tier-task_board

on: 
  pull_request: 
    branches: [Main, Testing]
  push:
    branches: [Main, Testing]

  workflow_dispatch:

permissions: 
  contents: read
concurrency:
  group: $ {{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  checkout-and-validate:
    name: "01. Checkout and repository validation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/workflows
          echo "Repository structure check passes"

  workflow-security-audit:
    name: "02. Github Actions security audit"
    needs: checkout-and-validate
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
          annotations: true
          persona: 'pedantic'
    




    
